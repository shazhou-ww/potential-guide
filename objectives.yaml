$schema: https://shazhou-ww.github.io/potential-guide/schemas/objectives/v1.json
objectives:
  standardize:
    description: Coordinate package-owned standardization and repository-wide delivery requirements.
    objective: "@potential-guide/objective-monorepo-standard"
    inputSchema:
      type: object
      additionalProperties: false
      maxProperties: 0
    subject: |
      {
        "context":context,
        "policy": {
          "source":"pnpm-default-v1",
          "packageLayers":"package-layers.yaml",
          "directories":{"apps":"apps","packages":"packages","docs":"docs","scripts":"scripts"},
          "requiredFiles":["tsconfig.json","biome.json"],
          "exceptions": [
            {"path":"apps/task-engine-webui","reason":"Local HTTP/browser app."},
            {"path":"apps/pguide-task-engine","reason":"Executable app."}
          ],
          "assignments": [],
          "allowedDirectories": [
            {"path":".agent/skills","reason":"Project skills per AGENTS.md."},
            {"path":"examples","reason":"Independent packed consumer examples."},
            {"path":"config","reason":"Repository-owned release policy."},
            {"path":"schemas","reason":"Published immutable JSON Schemas."}
          ],
          "dependencyExceptions": []
        },
        "deliveries": [
          {
            "id":"public-library-suite","purpose":"Package-specific npm libraries.","kind":"npm",
            "packages":["@potential-guide/pguide-task-engine","@potential-guide/task-engine-webui","@potential-guide/check-sdk","@potential-guide/check-environment","@potential-guide/task-protocol","@potential-guide/task-sdk","@potential-guide/task-engine","@potential-guide/task-engine-http","@potential-guide/task-engine-storage","@potential-guide/task-engine-server","@potential-guide/check-task","@potential-guide/check-artifacts","@potential-guide/check-runtime-files","@potential-guide/effects","@potential-guide/git-source","@potential-guide/objective-pilot","@potential-guide/objective-regulator","@potential-guide/regulation-coordinator","@potential-guide/cli-core","@potential-guide/pguide-config","@potential-guide/pguide-task-bundle","@potential-guide/pguide-agents","pguide","@potential-guide/pilot-protocol","@potential-guide/cli-runtime","@potential-guide/objective-declarations","@potential-guide/pguide-pilot","@potential-guide/pguide-regulate","@potential-guide/pguide-objectives","@potential-guide/objective-monorepo-standard","@potential-guide/objective-package-standard","@potential-guide/objective-devbox-health","@potential-guide/objective-pguide-setup","@potential-guide/objective-pguide-self-check","@potential-guide/objective-setup-marker"],
            "entry":{"package":"@potential-guide/objective-pilot","path":"src/index.ts"},
            "runtime":"node","resources":[],"services":[],"capabilities":[],"independent":false
          },
          {
            "id":"generic-task-server","purpose":"Business-free loopback service/UI.","kind":"cli",
            "packages":["@potential-guide/pguide-task-engine","@potential-guide/task-engine-webui","@potential-guide/cli-core","@potential-guide/task-protocol","@potential-guide/task-engine","@potential-guide/task-engine-http","@potential-guide/task-engine-storage","@potential-guide/task-engine-server"],
            "entry":{"package":"@potential-guide/pguide-task-engine","path":"src/main.ts"},
            "runtime":"node","resources":[],"services":[],"capabilities":[],"independent":false
          },
          {
            "id":"developer-commands","purpose":"pguide command extensions.","kind":"cli",
            "packages":["@potential-guide/check-artifacts","@potential-guide/check-runtime-files","@potential-guide/effects","@potential-guide/objective-pilot","@potential-guide/objective-regulator","@potential-guide/cli-core","@potential-guide/pguide-config","@potential-guide/pguide-task-bundle","@potential-guide/task-protocol","@potential-guide/task-sdk","@potential-guide/pguide-agents","pguide","@potential-guide/pilot-protocol","@potential-guide/cli-runtime","@potential-guide/objective-declarations","@potential-guide/pguide-pilot","@potential-guide/pguide-regulate","@potential-guide/pguide-objectives"],
            "entry":{"package":"pguide","path":"src/bin.ts"},
            "runtime":"node","resources":[],"services":[],"capabilities":[],"independent":false
          }
        ]
      }
