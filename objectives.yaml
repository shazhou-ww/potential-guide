$schema: https://shazhou-ww.github.io/potential-guide/schemas/objectives/v1.json
objectives:
  standardize:
    description: Coordinate package-owned standardization and repository-wide delivery requirements.
    objective: git+https://github.com/shazhou-ww/potential-guide.git#packages/objective-monorepo-standard/
    inputSchema:
      type: object
      additionalProperties: false
      maxProperties: 0
    subject: |
      {
        "context": context,
        "policy": {
          "source": "pnpm-default-v1",
          "packageLayers": "package-layers.yaml",
          "directories": {"apps": "apps", "packages": "packages", "docs": "docs", "scripts": "scripts"},
          "requiredFiles": ["tsconfig.json", "biome.json"],
          "exceptions": [],
          "assignments": [],
          "allowedDirectories": [
            {"path": "config", "reason": "Repository-owned release policy."},
            {"path": "schemas", "reason": "Canonical immutable JSON Schema publication sources."}
          ],
          "dependencyExceptions": []
        },
        "deliveries": [
          {
            "id": "public-library-suite",
            "purpose": "Publish the public packages as consumable npm libraries through package-specific releases.",
            "kind": "npm",
            "packages": ["@potential-guide/effects","@potential-guide/git-source","@potential-guide/objective-pilot","@potential-guide/objective-regulator","@potential-guide/objective-portfolio-supervisor","@potential-guide/cli-core","@potential-guide/pguide-config","@potential-guide/pguide-agents","pguide","@potential-guide/pilot-protocol","@potential-guide/cli-runtime","@potential-guide/objective-declarations","@potential-guide/pguide-pilot","@potential-guide/pguide-regulate","@potential-guide/pguide-supervise","@potential-guide/pguide-objectives"],
            "entry": {"package": "@potential-guide/objective-pilot", "path": "src/index.ts"},
            "runtime": "node", "resources": [], "services": [], "capabilities": [], "independent": false
          },
          {
            "id": "developer-commands",
            "purpose": "Deliver pguide and its configuration extension without coupling private checking tools to the public distribution.",
            "kind": "cli",
            "packages": ["@potential-guide/effects","@potential-guide/git-source","@potential-guide/objective-pilot","@potential-guide/objective-regulator","@potential-guide/objective-portfolio-supervisor","@potential-guide/cli-core","@potential-guide/pguide-config","@potential-guide/pguide-agents","pguide","@potential-guide/pilot-protocol","@potential-guide/cli-runtime","@potential-guide/objective-declarations","@potential-guide/pguide-pilot","@potential-guide/pguide-regulate","@potential-guide/pguide-supervise","@potential-guide/pguide-objectives"],
            "entry": {"package": "pguide", "path": "src/bin.ts"},
            "runtime": "node", "resources": [], "services": [], "capabilities": [], "independent": false
          }
        ]
      }
