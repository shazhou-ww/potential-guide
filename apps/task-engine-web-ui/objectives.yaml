$schema: https://shazhou-ww.github.io/potential-guide/schemas/objectives/v1.json
objectives:
  standardize:
    description: Standardize the independently started local HTTP workbench and its packaged browser bundle.
    objective: "@potential-guide/objective-package-standard"
    inputSchema: {type: object, additionalProperties: false, maxProperties: 0}
    subject: |
      {
        "root": context.repo.rootPath, "directory": context.path,
        "roles": ["npm"], "runtime": "node",
        "allows": ["@potential-guide/task-protocol", "@potential-guide/task-engine", "@potential-guide/task-engine-server", "@potential-guide/task-sdk"],
        "entries": ["src/main.ts", "src/server.ts", "src/browser.ts"],
        "generated": [], "deliveries": [],
        "joins": [{"id": "public-library-suite", "kind": "npm"}, {"id": "generic-task-server", "kind": "cli"}]
      }
