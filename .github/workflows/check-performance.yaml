name: Check performance

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact repository revision to measure
        required: true
        type: string
      baseline:
        description: Optional exact control revision to measure first on the same runner
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: [22.13.0, 24.11.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          path: subject
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.baseline != ''
        with:
          ref: ${{ inputs.baseline }}
          path: control
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: subject/package.json
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies and harness
        run: |
          pnpm --dir subject install --frozen-lockfile
          pnpm --dir harness install --frozen-lockfile
          if test -d control; then pnpm --dir control install --frozen-lockfile; fi
      - name: Cold control check on the paired runner
        if: inputs.baseline != ''
        run: node harness/scripts/measure-check.mjs control cold
      - name: Warm control check on the paired runner
        if: inputs.baseline != ''
        run: node harness/scripts/measure-check.mjs control warm
      - name: Cold check (no build or Turbo outputs)
        run: node harness/scripts/measure-check.mjs subject cold
      - name: Warm check (same checkout and caches)
        run: node harness/scripts/measure-check.mjs subject warm
      - name: Verify candidate worker cache restoration
        run: |
          if test -f subject/scripts/verify-worker-cache.mjs; then
            node subject/scripts/verify-worker-cache.mjs
          fi
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-metrics-${{ matrix.node }}
          path: |
            subject/.cache/check-metrics/
            control/.cache/check-metrics/
          include-hidden-files: true
