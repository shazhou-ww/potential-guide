name: Publish immutable schemas

on:
  push:
    branches: [main]
    paths: ["schemas/**", "scripts/publish-schemas.mjs", ".github/workflows/schemas.yml"]
  pull_request:
    paths: ["schemas/**", "scripts/publish-schemas.mjs", ".github/workflows/schemas.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schemas-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify immutable definitions and build site
        run: node scripts/publish-schemas.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .cache/schema-site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy schemas
        id: deployment
        uses: actions/deploy-pages@v4
