name: Publish package to npm

on:
  push:
    tags:
      - "checker-host-v*"
      - "objective-host-v*"
      - "effects-v*"
      - "git-source-v*"
      - "objective-pilot-v*"
      - "objective-regulator-v*"
      - "regulation-coordinator-v*"
      - "cli-core-v*"
      - "pguide-config-v*"
      - "pguide-agents-v*"
      - "pguide-v*"
      - "pilot-protocol-v*"
      - "cli-runtime-v*"
      - "objective-declarations-v*"
      - "pguide-pilot-v*"
      - "pguide-regulate-v*"
      - "pguide-objectives-v*"
      - "objective-monorepo-standard-v*"
      - "objective-package-standard-v*"
      - "objective-devbox-health-v*"
      - "objective-pguide-setup-v*"
      - "objective-pguide-self-check-v*"
      - "objective-setup-marker-v*"
  workflow_dispatch:
    inputs:
      package:
        description: Package whose Trusted Publisher connection should be dry-run
        required: true
        type: choice
        options:
          - checker-host
          - objective-host
          - effects
          - git-source
          - objective-pilot
          - objective-regulator
          - regulation-coordinator
          - cli-core
          - pguide-config
          - pguide-agents
          - pguide
          - pilot-protocol
          - cli-runtime
          - objective-declarations
          - pguide-pilot
          - pguide-regulate
          - pguide-objectives
          - objective-monorepo-standard
          - objective-package-standard
          - objective-devbox-health
          - objective-pguide-setup
          - objective-pguide-self-check
          - objective-setup-marker
      mode:
        description: Dry-run publishing or only verify an already-published version
        type: choice
        default: dry-run
        options:
          - dry-run
          - verify-published
      expected_latest:
        description: Recorded latest tag before publishing (required for verify-published)
        type: string
        default: ""

permissions: {}

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified package
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          cache: pnpm

      - name: Install the trusted publishing client
        run: npm install --global npm@11.21.0

      - name: Verify release metadata
        id: release
        env:
          PACKAGE_INPUT: ${{ inputs.package }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { join } from "node:path";
          import { parseReleaseTag, releasePackages, releaseVersion } from "./scripts/release-packages.mjs";

          const packages = Object.fromEntries(releasePackages.map((entry) => [
            entry.id,
            { ...entry, directory: join("packages", entry.directory) },
          ]));

          let packageId;
          let taggedVersion;
          if (process.env.RELEASE_EVENT === "push") {
            const release = parseReleaseTag(process.env.RELEASE_TAG ?? "");
            packageId = release.id;
            taggedVersion = release.version;
          } else {
            packageId = process.env.PACKAGE_INPUT;
          }

          const selected = packages[packageId];
          if (selected === undefined) {
            console.error(`::error::Unsupported package ${packageId}.`);
            process.exit(1);
          }

          const packageJson = JSON.parse(
            readFileSync(join(selected.directory, "package.json"), "utf8"),
          );
          if (packageJson.name !== selected.name) {
            console.error(
              `::error::Expected ${selected.name} in ${selected.directory}, received ${packageJson.name}.`,
            );
            process.exit(1);
          }
          if (packageJson.private === true) {
            console.error(`::error::${packageJson.name} is marked private.`);
            process.exit(1);
          }
          if (!releaseVersion.test(packageJson.version)) {
            console.error(
              `::error::Publishing accepts 0.x stable or rc SemVer versions only; received ${packageJson.version}.`,
            );
            process.exit(1);
          }
          if (packageJson.publishConfig?.access !== "public") {
            console.error(`::error::${packageJson.name} must publish with public access.`);
            process.exit(1);
          }
          if (
            process.env.RELEASE_EVENT === "push" &&
            taggedVersion !== packageJson.version
          ) {
            console.error(
              `::error::Tag version ${taggedVersion} does not match ${packageJson.name}@${packageJson.version}.`,
            );
            process.exit(1);
          }

          for (const [key, value] of Object.entries({
            directory: selected.directory,
            id: packageId,
            name: packageJson.name,
            version: packageJson.version,
            dist_tag: packageJson.version.includes("-rc.") ? "rc" : "latest",
          })) {
            appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          NODE

      - name: Verify release commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::The release commit must be reachable from origin/main."
            exit 1
          fi

      - name: Reject an existing npm version
        if: github.event_name == 'push'
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set +e
          result="$(
            npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version \
              --json \
              --registry=https://registry.npmjs.org/ 2>&1
          )"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION} is already published."
            exit 1
          fi
          if ! grep -q '"code": "E404"' <<<"$result"; then
            echo "$result"
            echo "::error::Could not determine whether ${PACKAGE_NAME}@${PACKAGE_VERSION} exists."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: pnpm check

      - name: Assign a temporary dry-run version
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'verify-published'
        env:
          PACKAGE_DIRECTORY: ${{ steps.release.outputs.directory }}
        run: |
          node --input-type=commonjs <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const { join } = require("node:path");

          const path = join(process.env.PACKAGE_DIRECTORY, "package.json");
          const packageJson = JSON.parse(readFileSync(path, "utf8"));
          packageJson.version = `0.0.0-oidc-dry-run.${process.env.GITHUB_RUN_ID}`;
          writeFileSync(path, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          pnpm --dir "$PACKAGE_DIRECTORY" run build

      - name: Pack package
        if: github.event_name == 'push' || inputs.mode != 'verify-published'
        id: pack
        env:
          PACKAGE_DIRECTORY: ${{ steps.release.outputs.directory }}
        run: |
          node --input-type=commonjs <<'NODE'
          const { appendFileSync, mkdirSync } = require("node:fs");
          const { resolve } = require("node:path");
          const { execFileSync } = require("node:child_process");

          const destination = resolve(process.env.RUNNER_TEMP, "npm-packages");
          mkdirSync(destination, { recursive: true });
          const result = JSON.parse(
            execFileSync(
              "pnpm",
              [
                "--dir",
                process.env.PACKAGE_DIRECTORY,
                "pack",
                "--pack-destination",
                destination,
                "--json",
              ],
              { encoding: "utf8" },
            ),
          );
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `tarball=${resolve(result.filename)}\n`,
          );
          NODE

      - name: Record distribution tags
        if: github.event_name == 'push'
        id: tags
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { appendFileSync } from "node:fs";
          const tags = JSON.parse(execFileSync("npm", [
            "view", process.env.PACKAGE_NAME, "dist-tags", "--json",
            "--registry=https://registry.npmjs.org/",
          ], { encoding: "utf8" }));
          appendFileSync(process.env.GITHUB_OUTPUT, `latest_before=${tags.latest ?? ""}\n`);
          console.log(JSON.stringify({ package: process.env.PACKAGE_NAME, tags }));
          NODE

      - name: Publish package
        if: github.event_name == 'push'
        run: >-
          npm publish "${{ steps.pack.outputs.tarball }}"
          --access public
          --tag "${{ steps.release.outputs.dist_tag }}"
          --registry=https://registry.npmjs.org/
          --loglevel=verbose

      - name: Verify published metadata and provenance
        if: github.event_name == 'push' || inputs.mode == 'verify-published'
        env:
          PACKAGE_ID: ${{ steps.release.outputs.id }}
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          LATEST_BEFORE: ${{ github.event_name == 'push' && steps.tags.outputs.latest_before || inputs.expected_latest }}
        run: node scripts/verify-published-package.mjs

      - name: Validate trusted publishing
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'verify-published'
        run: >-
          npm publish "${{ steps.pack.outputs.tarball }}"
          --dry-run
          --access public
          --tag oidc-dry-run
          --registry=https://registry.npmjs.org/
          --loglevel=verbose
