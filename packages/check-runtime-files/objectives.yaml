$schema: https://shazhou-ww.github.io/potential-guide/schemas/objectives/v1.json
objectives:
  standardize:
    description: Standardize shared private filesystem and immutable execution tree primitives.
    objective: "@potential-guide/objective-package-standard"
    inputSchema: {type: object, additionalProperties: false, maxProperties: 0}
    subject: |
      {
        "root": context.repo.rootPath, "directory": context.path,
        "roles": ["npm"], "runtime": "node", "allows": ["@potential-guide/artifact-files"],
        "entries": ["src/index.ts", "src/worker.ts", "src/worker-json.ts"],
        "generated": [{"path":"src/worker-source.ts","reason":"Deterministic closed Worker program generated and checked by embed-task-workers."},{"path":"src/runtime-identity.ts","reason":"Generated exact business source and embedded Worker identity."}], "deliveries": [],
        "joins": [{"id": "public-library-suite", "kind": "npm"}, {"id": "developer-commands", "kind": "cli"}, {"id": "generic-task-server", "kind": "cli"}]
      }
