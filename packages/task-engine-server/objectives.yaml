$schema: https://shazhou-ww.github.io/potential-guide/schemas/objectives/v1.json
objectives:
  standardize:
    description: Standardize the generic programmatic task Server without business dependencies.
    objective: "@potential-guide/objective-package-standard"
    inputSchema: {type: object, additionalProperties: false, maxProperties: 0}
    subject: |
      {
        "root": context.repo.rootPath, "directory": context.path,
        "roles": ["npm"], "runtime": "node",
        "allows": ["@potential-guide/pguide-task-bundle", "@potential-guide/task-protocol", "@potential-guide/task-engine", "@potential-guide/task-engine-http", "@potential-guide/task-engine-storage", "@potential-guide/task-sdk"],
        "entries": ["src/index.ts"], "generated": [], "deliveries": [],
        "joins": [{"id": "public-library-suite", "kind": "npm"}, {"id": "generic-task-server", "kind": "cli"}]
      }
