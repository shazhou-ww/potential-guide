$schema: https://shazhou-ww.github.io/potential-guide/schemas/objectives/v1.json
objectives:
  standardize:
    description: Standardize the public pguide command suite.
    objective: "@potential-guide/objective-package-standard"
    inputSchema: {type: object, additionalProperties: false, maxProperties: 0}
    subject: |
      {
        "root": context.repo.rootPath, "directory": context.path,
        "roles": ["npm", "cli"], "runtime": "node",
        "allows": ["@potential-guide/cli-core","@potential-guide/cli-runtime","@potential-guide/pguide-pilot","@potential-guide/pguide-regulate","@potential-guide/pguide-supervise","@potential-guide/pguide-objectives","@potential-guide/objective-pilot","@potential-guide/objective-regulator","@potential-guide/objective-portfolio-supervisor","@potential-guide/effects","@potential-guide/pguide-config","@potential-guide/pguide-agents","@potential-guide/git-source","@potential-guide/objective-declarations"],
        "entries": ["src/bin.ts"], "generated": [], "deliveries": [],
        "joins": [{"id": "public-library-suite", "kind": "npm"}, {"id": "developer-commands", "kind": "cli"}]
      }
