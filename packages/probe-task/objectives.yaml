$schema: https://shazhou-ww.github.io/potential-guide/schemas/objectives/v1.json
objectives:
  standardize:
    description: Standardize the Probe TaskType without depending on legacy Host lifecycle.
    objective: "@potential-guide/objective-package-standard"
    inputSchema: {type: object, additionalProperties: false, maxProperties: 0}
    subject: |
      {
        "root": context.repo.rootPath, "directory": context.path,
        "roles": ["npm"], "runtime": "node",
        "allows": ["@potential-guide/pguide-task-bundle", "@potential-guide/check-artifacts", "@potential-guide/check-task", "@potential-guide/task-protocol", "@potential-guide/task-engine", "@potential-guide/task-engine-server", "@potential-guide/task-engine-storage", "@potential-guide/task-sdk", "@potential-guide/task-engine-http"],
        "entries": ["src/index.ts"], "generated": [{"path":"src/worker-source.ts","reason":"Deterministic closed business Worker generated and checked by embed-task-workers."},{"path":"src/runtime-identity.ts","reason":"Generated exact business source and embedded Worker identity."}], "deliveries": [],
        "joins": [{"id": "public-library-suite", "kind": "npm"}]
      }
