$schema: https://shazhou-ww.github.io/potential-guide/schemas/objectives/v1.json
objectives:
  standardize:
    description: Standardize standalone Task Bundle authoring and the isolated Worker runtime.
    objective: "@potential-guide/objective-package-standard"
    inputSchema: {type: object, additionalProperties: false, maxProperties: 0}
    subject: |
      {
        "root": context.repo.rootPath, "directory": context.path,
        "roles": ["npm"], "runtime": "node",
        "allows": ["@potential-guide/task-protocol", "@potential-guide/check-artifacts"],
        "entries": ["src/index.ts", "src/build.ts", "src/artifact.ts", "src/publish.ts"], "generated": [], "deliveries": [],
        "joins": [{"id": "public-library-suite", "kind": "npm"}, {"id": "developer-commands", "kind": "cli"}]
      }
