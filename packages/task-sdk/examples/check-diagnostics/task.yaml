$schema: https://shazhou-ww.github.io/potential-guide/schemas/artifacts/task/v2.json
name: Diagnostic assertions
runtime:
  type: node
  minVersion: 22.13.0
entry: worker.cjs
inputSchema:
  type: object
  properties:
    checks:
      type: array
      maxItems: 100
      items:
        type: object
        properties:
          name: { type: string, maxLength: 200 }
          expected: { type: string }
          actual: { type: string }
        required: [name, expected, actual]
        additionalProperties: false
  required: [checks]
  additionalProperties: false
resultSchema:
  type: object
  properties:
    ok: { type: boolean }
    problemCount: { type: integer, minimum: 0 }
  required: [ok, problemCount]
  additionalProperties: false
messageSchema: false
