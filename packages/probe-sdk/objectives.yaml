$schema: https://shazhou-ww.github.io/potential-guide/schemas/objectives/v1.json
objectives:
  standardize:
    description: Standardize Probe Task authoring and independent Check execution composition.
    objective: "@potential-guide/objective-package-standard"
    inputSchema: {type: object, additionalProperties: false, maxProperties: 0}
    subject: |
      {
        "root": context.repo.rootPath, "directory": context.path,
        "roles": ["tool"], "runtime": "node",
        "allows": ["@potential-guide/check-sdk", "@potential-guide/ipfs-content", "@potential-guide/task-authoring"],
        "entries": ["src/index.ts", "src/contracts.ts", "src/authoring.ts", "src/execution.ts", "src/publication.ts"],
        "generated": [], "deliveries": [], "joins": []
      }
