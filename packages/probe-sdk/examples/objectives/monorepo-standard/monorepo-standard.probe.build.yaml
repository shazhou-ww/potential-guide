    source:
      kind: ipfs
      cid: bafybeiddh766ctfmeqgiehph7sc4qi7p6tb4qrwluylowp4ekkawvveeb4
  workspace:
    source:
      kind: ipfs
      cid: bafybeifluumi66st55omw4eru3sgb234jhpihuj2uab4tb3cli2cmuk4oe
  policy:
    source:
      kind: ipfs
      cid: bafybeiei2ltfzfltrgj2svvrtvihzjcf2cabmj2bfy2mvmecjgu7vakplm
checks:
