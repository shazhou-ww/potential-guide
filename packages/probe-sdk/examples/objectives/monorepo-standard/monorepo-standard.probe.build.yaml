  entry: src/main.ts
  contract: src/contract.ts
languages: [en]
referenceRoot: references
bundles:
  toolchain:
    source:
      kind: ipfs
      cid: bafybeifydrqggqypfapxiwt2bpovdprxae6iysrjhiua3d2jebico74u7a
  workspace:
    source:
      kind: ipfs
      cid: bafybeicx45guntfoueeddml532gfayxuvo5jhujuf4q2wasnef4ysyrfhe
  policy:
    source:
      kind: ipfs
      cid: bafybeia3bpqxern3vs56ewbryvztv2ayodqdt55du5v3s7xrtz24b3eyya
checks:
  node:
    bundle: toolchain
