$schema: https://shazhou-ww.github.io/potential-guide/schemas/objectives/v1.json
objectives:
  standardize:
    description: Standardize the standalone repository Objective.
    objective: "@potential-guide/objective-package-standard"
    inputSchema: {type: object, additionalProperties: false, maxProperties: 0}
    subject: |
      {
        "root": context.repo.rootPath, "directory": context.path,
        "roles": ["npm", "tool"], "runtime": "node",
        "allows": ["@potential-guide/effects", "@potential-guide/objective-pilot", "@potential-guide/objective-regulator", "@potential-guide/objective-package-standard", "pguide"],
        "entries": ["src/index.ts"], "generated": [],
        "joins": [{"id":"public-library-suite","kind":"npm"}], "deliveries": []
      }
