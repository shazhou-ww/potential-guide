$schema: https://shazhou-ww.github.io/potential-guide/schemas/objective/v1.json
subjectSchema:
  type: object
  additionalProperties: false
  properties:
    root:
      type: string
      minLength: 1
    directory:
      type: string
      pattern: ^(?!/|[A-Za-z]:)(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*//)(?!.*\\)(?!.*\/$).+
    roles:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        enum:
          - npm
          - cli
          - browser
          - cloudflare-worker
          - internal
          - tool
    runtime:
      enum:
        - node
        - browser
        - worker
        - tool
        - universal
    allows:
      type: array
      items:
        type: string
        minLength: 1
      uniqueItems: true
    entries:
      type: array
      items:
        type: string
        pattern: ^(?!/|[A-Za-z]:)(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*//)(?!.*\\)(?!.*\/$).+
      uniqueItems: true
    generated:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          path:
            type: string
            pattern: ^(?!/|[A-Za-z]:)(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*//)(?!.*\\)(?!.*\/$).+
          reason:
            type: string
            minLength: 1
        required:
          - path
          - reason
    joins:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          id:
            type: string
            minLength: 1
          kind:
            type: string
            minLength: 1
        required:
          - id
          - kind
    deliveries:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          id:
            type: string
            minLength: 1
          purpose:
            type: string
            minLength: 1
          kind:
            type: string
            minLength: 1
          packages:
            type: array
            items:
              type: string
              minLength: 1
            uniqueItems: true
            minItems: 1
          entry:
            type: object
            additionalProperties: false
            properties:
              package:
                type: string
                minLength: 1
              path:
                type: string
                pattern: ^(?!/|[A-Za-z]:)(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*//)(?!.*\\)(?!.*\/$).+
            required:
              - package
              - path
          runtime:
            enum:
              - node
              - browser
              - worker
              - tool
              - universal
          environment:
            type: string
            minLength: 1
          config:
            type: string
            pattern: ^(?!/|[A-Za-z]:)(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*//)(?!.*\\)(?!.*\/$).+
          output:
            type: string
            pattern: ^(?!/|[A-Za-z]:)(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*//)(?!.*\\)(?!.*\/$).+
          resources:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                kind:
                  enum:
                    - configuration
                    - secret
                    - resource
                    - identity
                    - service
                visibility:
                  enum:
                    - public
                    - server
                supply:
                  enum:
                    - build
                    - runtime
                    - platform
                environment:
                  type: string
                  minLength: 1
              required:
                - name
                - kind
                - visibility
                - supply
                - environment
          services:
            type: array
            items:
              type: string
              minLength: 1
            uniqueItems: true
          capabilities:
            type: array
            items:
              type: string
              minLength: 1
            uniqueItems: true
          independent:
            type: boolean
          migration:
            type: object
            additionalProperties: false
            properties:
              package:
                type: string
                minLength: 1
              entry:
                type: string
                pattern: ^(?!/|[A-Za-z]:)(?!.*(?:^|/)\.{1,2}(?:/|$))(?!.*//)(?!.*\\)(?!.*\/$).+
              resource:
                type: string
                minLength: 1
            required:
              - package
              - entry
              - resource
        required:
          - id
          - purpose
          - kind
          - packages
          - entry
          - runtime
          - resources
          - services
          - capabilities
          - independent
  required:
    - root
    - directory
    - roles
    - runtime
    - allows
    - entries
    - generated
    - joins
    - deliveries
levels:
  - id: initial
    checks:
      - id: structure
        problems:
          - structure-incomplete
  - id: structured
    checks:
      - id: deliveries
        problems:
          - delivery-incomplete
defaultLanguage: zh-CN
languages:
  - zh-CN
