$schema: https://shazhou-ww.github.io/potential-guide/schemas/objective/v2.json
subjectSchema:
  type: object
  required: [marker, expected]
  additionalProperties: false
  properties:
    marker: {type: string, minLength: 1}
    expected: {type: string, minLength: 48, maxLength: 48}
levels:
  - id: repaired
    checks:
      - id: marker
        problems: [marker-incorrect]
defaultLanguage: en-US
languages: [en-US]
