$schema: https://shazhou-ww.github.io/potential-guide/schemas/objectives/v1.json
objectives:
  standardize:
    description: Standardize the private pguide self-check Pilot.
    objective: git+https://github.com/shazhou-ww/potential-guide.git#packages/objective-monorepo-standard/package-standard/
    inputSchema: {type: object, additionalProperties: false, maxProperties: 0}
    subject: |
      {
        "root": context.repo.rootPath, "directory": context.path,
        "roles": ["tool"], "runtime": "node",
        "allows": ["@potential-guide/objective-pguide-setup", "@potential-guide/cli-core", "pguide"],
        "entries": ["self-check.mjs"], "generated": [], "joins": [], "deliveries": []
      }
